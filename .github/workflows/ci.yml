# Ворота CI (план/p0.md, P0.2). Активация ворот по фазам (research/r2.md):
#   - активно сейчас: build + vet + staticcheck + test -race (make check)
#   - fuzz-смоук:      фаза 1 (протокольный слой) — заглушка ниже
#   - бюджеты бенчей:  фаза 4 (p99 тика)          — заглушка ниже
#   - нагрузочный смоук с ботами: фаза 4          — заглушка ниже
# Ворота, которые всегда зелёные, — карго-культ; заглушки активируются вместе с кодом фаз.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ворота (build + vet + staticcheck + test -race)
        run: make check

      - name: Fuzz-смоук (фаза 1+)
        # Список целей — единый источник в Makefile (рассинхрон списков устранён в P3.12).
        run: make fuzz-smoke

      # Embed-транспорт (фаза 2): шаг 1 обязан идти до записи артефакта.
      - name: Embed-транспорт (фаза 2)
        run: |
          set -e
          if go build -tags embedded ./... 2>err.txt; then
            echo "FAIL: сборка с тегом embedded обязана падать без артефакта"; cat err.txt; exit 1
          fi
          grep -q "no matching files" err.txt || { echo "FAIL: неожиданная ошибка"; cat err.txt; exit 1; }
          mkdir -p "$RUNNER_TEMP/geosynth"
          cp internal/geo/testdata/golden_flat.l2j "$RUNNER_TEMP/geosynth/16_10.l2j"
          cp internal/geo/testdata/golden_ml.l2j "$RUNNER_TEMP/geosynth/17_10.l2j"
          go run ./cmd/l2data build internal/data/testdata/synth "$RUNNER_TEMP/geosynth"
          go vet -tags embedded ./internal/artifact/
          go test -tags embedded ./internal/artifact/
          # Оба поставочных бинарника в embedded-конфигурации на синт-артефакте
          # (для l2login тег инертен — артефакт не импортируется; сборка
          # доказывает компиляцию поставочной конфигурации; прецедент P2.7).
          go build -tags embedded ./cmd/...
          # Диспетч статики cmd/l2go под тегом (P3.13): пустой -artifact —
          # вшитые байты, непустой — файл (фальсификатор-самозванец без гео),
          # replay-guard, полный контур на вшитой статике. Race-эквивалент —
          # dev-прогон make check (новой конкуренции нет: стартовый путь);
          # группа — точечная компиляционно-поведенческая проверка.
          go test -tags embedded -count=1 ./cmd/l2go -run 'TestLoadStatic|TestReplayRequires|TestBootstrapEmbeddedEmptyArtifact'

      # Run-цели Makefile (P3.13): guard обязан громко падать без bin/
      # с подсказкой make embedded (молчаливый ноль — класс P3.4-F7).
      - name: "Run-цели: guard без bin/ (P3.13)"
        run: |
          set -e
          for tgt in run-login run-game; do
            if make "$tgt" >out.txt 2>err.txt; then
              echo "FAIL: make $tgt обязан падать без bin/"; exit 1
            fi
            grep -q "make embedded" err.txt || { echo "FAIL: make $tgt без подсказки"; cat err.txt; exit 1; }
          done

      # Реплей-гейт D6 (фаза 3): закоммиченная фикстура DoD-сессии × текущий
      # код свёртки — ловит дрейф детерминизма между коммитами. Артефакт —
      # построенный embed-шагом синт (тот же конвейер, что у записи);
      # отпечаток отличается — сначала перезаписать фикстуру.
      - name: Реплей-гейт (фаза 3)
        run: |
          set -e
          art=internal/artifact/embedded/artifact.l2a
          want_sha="$(cat cmd/l2go/testdata/replay-dod/artifact.sha256)"
          got_sha="$(sha256sum "$art" | cut -d' ' -f1)"
          if [ "$want_sha" != "$got_sha" ]; then
            echo "FAIL: артефакт реплея разошёлся с отпечатком записи ($got_sha ≠ $want_sha); перезапись фикстуры: L2GO_RECORD_FIXTURE=1 go test -run TestReplayRecordFixture ./cmd/l2go"; exit 1
          fi
          go run ./cmd/l2go -replay cmd/l2go/testdata/replay-dod \
            -artifact "$art" \
            -expect cmd/l2go/testdata/replay-dod/final.dump

      # E2E-смоук DoD (фаза 3): повторный прогон без -race ради времени смоука
      # в журнале шага (буква p3.md §P3.12); -race-прогон — в make check.
      - name: E2E-смоук DoD (фаза 3)
        run: go test -count=1 -v -run '^TestE2EFullDodScenario$' ./cmd/l2go

      # Фаза 4: go test -bench=. -benchmem + benchstat-бюджет p99 тика (red при регрессе)
      # Фаза 4: нагрузочный смоук с ботами (headless-клиенты из фазы 1)
